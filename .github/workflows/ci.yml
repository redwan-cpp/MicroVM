# CI ("continuous integration"): GitHub runs these checks on every push and
# pull request, so a broken change gets caught right away, not weeks later.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, nothing more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # same Go version as on your computer
      - run: make lint
      - run: make test
      - run: make build
